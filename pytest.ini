[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Functional requirement tests (Ingestion, Split, Transforms, Model, Loss/Opt)
    tier2: Boundary and corner cases (RGBA handling, smallest class, zero leakage, device fallback)
    tier3: Output artifacts verification (checkpoint .pth, report figures .png)
    tier4: Notebook verification (JSON structure, cell types, execution tracebacks)
